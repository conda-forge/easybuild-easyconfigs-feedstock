{% set version = "5.1.0" %}

package:
  name: easybuild-easyconfigs
  version: {{ version }}

source:
  fn: easybuild-easyconfigs-{{ version }}.tar.gz
  url: https://pypi.org/packages/source/e/easybuild-easyconfigs/easybuild_easyconfigs-{{ version }}.tar.gz
  sha256: 14e3c566a7104035d2ed7dbb7c68f464fd118bd11966ed369265c7ea10286930

build:
  number: 0
  skip: true  # [win or py3k]
  script: python setup.py install --single-version-externally-managed --record record.txt

requirements:
  host:
    - python
    - setuptools
  run:
    - python
    - easybuild-framework >=3
    - easybuild-easyblocks >=3.5

test:
  imports:
    - easybuild

about:
  home: http://hpcugent.github.com/easybuild
  license: GPL-2.0
  license_file: LICENSE
  summary: Easyconfig files are simple build specification files for EasyBuild,\nthat specify the build parameters for software packages (version, compiler toolchain, dependency versions, etc.).
  license_family: GPL2

extra:
  recipe-maintainers:
    - jerowe
    - boegel
